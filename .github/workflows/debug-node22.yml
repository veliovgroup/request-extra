name: Debug node22 consumer

on:
  pull_request:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.14.0
      - run: npm ci
      - run: node -v && npm -v && mount | grep -E ' /tmp | / ' || true
      - run: |
          set -x
          npm pack --pack-destination /tmp
          mkdir -p /tmp/consumer && cd /tmp/consumer && echo '{"name":"c","private":true}' > package.json
          npm install --no-audit --no-fund --foreground-scripts /tmp/request-libcurl-*.tgz 2>&1 | tail -40
          ls -la node_modules/node-libcurl/lib/binding/
          sha256sum node_modules/node-libcurl/lib/binding/node_libcurl.node $GITHUB_WORKSPACE/node_modules/node-libcurl/lib/binding/node_libcurl.node
          file node_modules/node-libcurl/lib/binding/node_libcurl.node $GITHUB_WORKSPACE/node_modules/node-libcurl/lib/binding/node_libcurl.node
          ldd node_modules/node-libcurl/lib/binding/node_libcurl.node || true
          node -e "require('node-libcurl'); console.log('consumer load ok')" || true
          node -e "process.dlopen(module, require.resolve('node-libcurl/lib/binding/node_libcurl.node')); console.log('dlopen ok')" || true
          cp -r $GITHUB_WORKSPACE/node_modules/node-libcurl/lib/binding/node_libcurl.node ./root-copy.node
          node -e "process.dlopen(module, '/tmp/consumer/root-copy.node'); console.log('root copy in /tmp ok')" || true
          mkdir -p $GITHUB_WORKSPACE/wsconsumer && cp node_modules/node-libcurl/lib/binding/node_libcurl.node $GITHUB_WORKSPACE/wsconsumer/
          node -e "process.dlopen(module, '$GITHUB_WORKSPACE/wsconsumer/node_libcurl.node'); console.log('consumer copy in workspace ok')" || true
      - run: |
          set -x
          sudo apt-get install -y -qq strace >/dev/null 2>&1 || true
          env | grep -iE '^(node|npm)' || true
          C=/tmp/consumer/node_modules/node-libcurl
          W=$GITHUB_WORKSPACE/node_modules/node-libcurl
          cd $GITHUB_WORKSPACE && node -e "require('$C'); console.log('A: consumer pkg from workspace cwd ok')" || echo "A failed"
          cd /tmp/consumer && node -e "require('$W'); console.log('B: workspace pkg from /tmp cwd ok')" || echo "B failed"
          cd $GITHUB_WORKSPACE && node -e "require('$W'); console.log('C: workspace pkg from workspace cwd ok')" || echo "C failed"
          cd /tmp/consumer && node -e "globalThis.__libcurlTls=require('node:tls'); process.dlopen(module, '$C/lib/binding/node_libcurl.node'); console.log('D: tls global ok')" || echo "D failed"
          cd /tmp/consumer && node -e "globalThis.__libcurlTls=require('node:tls'); globalThis.__libcurlCurlEasyError=require('$C/dist/CurlEasyError').CurlEasyError; globalThis.__libcurlCurlMultiError=require('$C/dist/CurlMultiError').CurlMultiError; globalThis.__libcurlCurlSharedError=require('$C/dist/CurlSharedError').CurlSharedError; process.dlopen(module, '$C/lib/binding/node_libcurl.node'); console.log('E: all globals ok')" || echo "E failed"
          cd /tmp/consumer && strace -f -o /tmp/st.txt node -e "require('$C')" || true
          grep -nE "EINVAL" /tmp/st.txt | tail -20 || true
          grep -nE "^[0-9]+ +(openat|readlink|access).*(tls|cert|ssl|curl)" /tmp/st.txt | tail -20 || true
